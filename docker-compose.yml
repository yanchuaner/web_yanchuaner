# ============================================
# 燕中校友数字母港 — Docker Compose
# 部署命令: docker compose up -d
# ============================================

services:
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    env_file:
      - .env.staging
    environment:
      DATABASE_URL: file:/data/staging.db
    volumes:
      - ./.tmp/staging-data:/data
      - ./.tmp/staging-uploads:/uploads
    command:
      - sh
      - -c
      - >-
        mkdir -p /data /uploads &&
        touch /data/staging.db &&
        npx prisma migrate deploy &&
        chown -R 1001:1001 /data /uploads
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yanchuan-alumni-staging
    restart: unless-stopped
    ports:
      - "${STAGING_PORT:-3100}:3000"
    env_file:
      - .env.staging
    environment:
      DATABASE_URL: file:/data/staging.db
      UPLOAD_DIR: /app/public/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - ./.tmp/staging-data:/data
      - ./.tmp/staging-uploads:/app/public/uploads
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000/api/health').then((response) =>
          process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  redis:
    image: redis:7.4-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    restart: unless-stopped
    env_file:
      - .env.staging
    command:
      - /bin/sh
      - -ec
      - exec redis-server --appendonly yes --requirepass "$${STAGING_REDIS_PASSWORD}"
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli -a "$${STAGING_REDIS_PASSWORD}" --no-auth-warning ping | grep -q PONG
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  redis_data:
