name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    name: Typecheck, lint, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: file:./prisma/ci.db
      SESSION_SECRET: ci-temp-session-secret-for-build-only
      APP_URL: http://localhost:3000
      SITE_URL: http://localhost:3000
      SITE_NAME: 燕中校友数字母港
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Initialize isolated CI database
        run: npm run db:init

      - name: Seed isolated CI database
        run: npm run seed

      - name: Seed isolated acceptance fixtures
        env:
          NODE_ENV: development
          ACCEPTANCE_ALLOW_MUTATION: "true"
        run: npm run seed:acceptance

      - name: Run release checks
        run: npm run release:check

      - name: Start isolated acceptance service
        env:
          NODE_ENV: development
          APP_URL: http://127.0.0.1:3101
          SITE_URL: http://127.0.0.1:3101
          MP_DEV_MOCK_LOGIN_ENABLED: "true"
          MP_DEV_MOCK_USER_IDS: acceptance-verified,acceptance-candidate,acceptance-deletion
        run: |
          npm run dev -- -p 3101 > /tmp/yanchuaner-acceptance.log 2>&1 &
          echo $! > /tmp/yanchuaner-acceptance.pid
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3101/api/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/yanchuaner-acceptance.log
          exit 1

      - name: Run isolated business acceptance
        env:
          ACCEPTANCE_BASE_URL: http://127.0.0.1:3101
        run: npm run test:acceptance

      - name: Stop isolated acceptance service
        if: always()
        run: |
          if test -f /tmp/yanchuaner-acceptance.pid; then
            kill "$(cat /tmp/yanchuaner-acceptance.pid)" 2>/dev/null || true
          fi

      - name: Build
        run: npm run build

      - name: Start application for smoke test
        run: |
          npm run start > /tmp/yanchuaner-next.log 2>&1 &
          echo $! > /tmp/yanchuaner-next.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/api/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/yanchuaner-next.log
          exit 1

      - name: Smoke test public and protected boundaries
        env:
          SMOKE_BASE_URL: http://127.0.0.1:3000
        run: npm run smoke

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run desktop and mobile UI acceptance
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
        run: npm run test:e2e -- --workers=1
